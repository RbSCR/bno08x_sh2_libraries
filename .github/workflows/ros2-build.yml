name: ROS 2 Build

on:
  pull_request:
    branches: [ main  ]
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ros_distribution:
          - jazzy
          - kilted
        include:
          # Jazzy Ubuntu 24.04 (Noble)
          - ros_distribution: jazzy
            docker_image: osrf/ros:jazzy-desktop
            use_ros2_testing: false
          # Kilted Ubuntu 24.04 (Noble)
          - ros_distribution: kilted
            docker_image: osrf/ros:kilted-desktop
            use_ros2_testing: false

    container:
      image: ${{ matrix.docker_image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup ROS environment
        uses: ros-tooling/setup-ros@v0.7.19
        with:
          required-ros-distributions: ${{ matrix.ros_distribution }}
          use-ros2-testing: ${{ matrix.use_ros2_testing }}

      - name: Build and Test
        uses: ros-tooling/action-ros-ci@v0.4.8
        with:
          target-ros2-distro: ${{ matrix.ros_distribution }}
          package-name: bno08x_sh2_libraries
          vcs-repo-file-url: ""
          colcon-defaults: ""
          # no mixin "coverage-gcc" until there are more tests
